name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install from lockfile
        run: uv sync --locked

      - name: Compile
        run: uv run python -m compileall -q src tests

      - name: Tests (synthetic fixtures only)
        run: uv run pytest -q

  pip-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Editable pip install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          linkedin-network-mcp --help

      - name: Ingest synthetic fixture and run warm_list
        run: |
          linkedin-network-mcp ingest tests/fixtures/synthetic_export --db "$RUNNER_TEMP/ci.db"
          linkedin-network-mcp query warm_list '{"limit":3}' --db "$RUNNER_TEMP/ci.db"
          linkedin-network-mcp export warm_list --format md --db "$RUNNER_TEMP/ci.db"

  no-real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only synthetic fixtures may be tracked as CSV/ZIP/DB
        run: |
          offenders=$(git ls-files | grep -Ei '\.(csv|zip|db|sqlite3?)$' | grep -v '^tests/fixtures/' || true)
          if [ -n "$offenders" ]; then
            echo "Tracked data files outside tests/fixtures:"
            echo "$offenders"
            exit 1
          fi
