[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkedin-network-mcp"
version = "0.2.0"
description = "Local-first MCP server for querying a LinkedIn data export."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fastmcp>=4.1,<5",
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
linkedin-network-mcp = "linkedin_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
